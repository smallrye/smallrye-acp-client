# Build an uber-jar for standalone execution
quarkus.package.jar.type=uber-jar

# Disable the Quarkus banner for CLI usage
quarkus.banner.enabled=false

# Logging configuration — console enabled but suppressed by default (WARNING level).
# Verbose mode (-v) lowers to INFO at runtime.
quarkus.log.console.enabled=true
quarkus.log.level=WARNING
quarkus.log.category."io.smallrye.acp".level=WARNING
quarkus.log.category."io.smallrye.agentclientprotocol".level=WARNING
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{1}] %s%e%n
